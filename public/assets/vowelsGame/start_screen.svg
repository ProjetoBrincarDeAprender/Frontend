<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#FFF1C9"/>
      <stop offset="100%" stop-color="#FFD1E6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feBlend in="SourceGraphic" in2="b" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Decorative circles -->
  <g opacity="0.9">
    <circle cx="140" cy="120" r="90" fill="#FFB6C1" filter="url(#soft)" />
    <circle cx="660" cy="180" r="70" fill="#B3E5FC" filter="url(#soft)" />
    <circle cx="500" cy="420" r="110" fill="#C8E6C9" filter="url(#soft)" />
  </g>

  <!-- Title -->
  <text x="50%" y="170" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="48" font-weight="700" fill="#2b2b2b">Jogo das Vogais</text>

  <!-- Subtitle -->
  <text x="50%" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#4a4a4a">Aprenda as vogais brincando!</text>

  <!-- Letters A and E as playful elements -->
  <g transform="translate(220,280)">
    <circle cx="0" cy="0" r="56" fill="#FFD54F" />
    <text x="0" y="12" text-anchor="middle" font-family="Verdana" font-size="48" font-weight="700" fill="#333">A</text>
  </g>

  <g transform="translate(520,260)">
    <rect x="-66" y="-66" width="132" height="132" rx="20" ry="20" fill="#81C784" />
    <text x="0" y="18" text-anchor="middle" font-family="Verdana" font-size="48" font-weight="700" fill="#fff">E</text>
  </g>

  <!-- Start button (visual) -->
  <g transform="translate(400,480)" id="start-button">
    <rect x="-120" y="-36" width="240" height="72" rx="14" fill="#4CAF50" />
    <text x="0" y="12" text-anchor="middle" font-family="Verdana" font-size="22" font-weight="700" fill="#fff">Clique para começar</text>
  </g>

  <!-- Footer small hint -->
  <text x="50%" y="570" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">Toque/click na tela para iniciar</text>
</svg>