<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="100" rx="40" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="170" cy="90" rx="50" ry="30" fill="white" opacity="0.8"/>
  <ellipse cx="190" cy="100" rx="35" ry="20" fill="white" opacity="0.8"/>
  
  <ellipse cx="600" cy="120" rx="45" ry="28" fill="white" opacity="0.7"/>
  <ellipse cx="620" cy="110" rx="55" ry="35" fill="white" opacity="0.7"/>
  <ellipse cx="640" cy="120" rx="40" ry="25" fill="white" opacity="0.7"/>
  
  <!-- Sun -->
  <circle cx="700" cy="80" r="30" fill="#FFD700" opacity="0.9"/>
  <line x1="700" y1="30" x2="700" y2="50" stroke="#FFD700" stroke-width="3"/>
  <line x1="700" y1="110" x2="700" y2="130" stroke="#FFD700" stroke-width="3"/>
  <line x1="650" y1="80" x2="670" y2="80" stroke="#FFD700" stroke-width="3"/>
  <line x1="730" y1="80" x2="750" y2="80" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="500" r="8" fill="#90EE90" opacity="0.6"/>
  <circle cx="120" cy="520" r="6" fill="#90EE90" opacity="0.6"/>
  <circle cx="680" cy="480" r="10" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="720" cy="500" r="7" fill="#FFB6C1" opacity="0.6"/>
</svg>